name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke suite (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run @smoke scenarios
        run: mvn -B --no-transfer-progress clean test -Dheadless=true
      - name: Summarise failure pages
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re
          for f in sorted(glob.glob('target/screenshots/*.html')):
              s = open(f, encoding='utf-8', errors='ignore').read()
              print('=' * 25, f, s.splitlines()[0])
              for pat in [r'<img\b[^>]*>', r'<[^>]*id="product[^"]*"[^>]*>', r'<form[^>]*>', r'<h1[^>]*>.*?</h1>',
                          r'<[^>]*class="[^"]*(?:product|search|result)[^"]*"[^>]*>']:
                  for m in list(dict.fromkeys(re.findall(pat, s, re.S)))[:12]:
                      print('  ', re.sub(r'\s+', ' ', m)[:230])
          EOF

      - name: Upload Cucumber report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            target/cucumber-reports/
            target/screenshots/
            target/surefire-reports/
          if-no-files-found: ignore
